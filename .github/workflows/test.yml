name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        # Audit shipped (production) dependencies and fail on moderate+ severity.
        # Dev/build-tool advisories (e.g. a typescript major-version bump) are
        # tracked separately so they do not block delivery of the app itself.
        #
        # The threshold was `high` until 2026-08-07, when GHSA-55q2-fjhq-7xh7
        # (dompurify <=3.4.12, MODERATE: "IN_PLACE hook removal leaves a
        # detached subtree executable, causing XSS") sat in a DIRECT production
        # dependency while this step still exited 0. Measured both directions on
        # the same pre-fix lockfile: `--audit-level=high` PRINTED the advisory
        # and exited 0; `--audit-level=moderate` exited 1. dompurify is the
        # app's only untrusted-HTML sanitiser -- `DOMPurify.sanitize(email
        # .body_html)` feeds the single dangerouslySetInnerHTML on a portal
        # surface (src/features/portal/projectDetail.tsx:193) -- so the one
        # advisory class this gate exists to stop was exactly the class it could
        # not see. `high` is a reasonable floor for a large dependency tree;
        # this repo's production tree is four direct packages (dompurify,
        # highlight.js, react, react-dom), so `moderate` costs ~nothing.
        #
        # Locked against silent loosening (threshold drift, `continue-on-error`,
        # `|| true`) and against scope drift (a devDependency that shipped code
        # imports would be bundled yet invisible to `--omit=dev`) by
        # src/features/site/dependencyAuditGate.test.ts.
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage-final.json
          flags: infraportal
          name: infraportal-coverage
        continue-on-error: true

      - name: Check test results
        if: failure()
        run: echo "::error::Tests failed. See output above for details."
        shell: bash

  lint:
    runs-on: ubuntu-latest
    name: Linting
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check lint results
        if: failure()
        run: echo "::error::Linting failed. See output above for details."
        shell: bash

  typecheck:
    runs-on: ubuntu-latest
    name: Type Check
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        # tsc is the only gate that catches undefined imports / type errors.
        # vite build uses esbuild, which strips types without checking, so
        # runtime-fatal bugs (e.g. a missing import) can otherwise ship to prod.
        run: npm run typecheck

      - name: Check typecheck results
        if: failure()
        run: echo "::error::Type check failed. Undefined imports or type errors would crash at runtime."
        shell: bash

  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        # The ONLY required check that runs the real Vite/PostCSS production
        # build. tsc/eslint/vitest never invoke PostCSS, so a build-breaking
        # regression - e.g. a literal `*/` inside a CSS comment, which shipped
        # TWICE in v1.18.4 (PR #40/#41) and only failed the post-merge Pages
        # deploy - could merge with every required check green. This closes that
        # gap: a broken production build now blocks the merge, not the deploy.
        run: npm run build

      - name: Check build results
        if: failure()
        run: echo "::error::Production build failed (Vite/PostCSS). A broken build would fail the Pages deploy after merge - fix before merging."
        shell: bash
