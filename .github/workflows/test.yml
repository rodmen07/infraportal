name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── The advisory full-tree audit (DEP-AUDIT-SCOPE-1, owner decision 2026-08-10) ──
  #
  # A SECOND audit, at a SECOND scope, in a job of its own. The required gate in
  # `test` below keeps `--omit=dev` and is not weakened, narrowed, or replaced by
  # this; the two answer different questions and both answers are wanted.
  #
  #   test / "Unit Tests"                 npm audit --omit=dev --audit-level=moderate
  #     what a VISITOR downloads. REQUIRED context -> blocks the merge.
  #
  #   audit-full-tree / this job          npm audit --audit-level=moderate
  #     what the BUILD and a developer's machine run. NOT a required context ->
  #     reports, never blocks.
  #
  # Why the second scope exists at all: `--omit=dev` drops the entire
  # devDependencies tree, so it is structurally incapable of seeing a dev-tool
  # advisory. Measured on the pre-PR-#137 lockfile: both HIGH advisories cleared
  # by PR #131 were `"dev": true` and the required step reported "found 0
  # vulnerabilities" before AND after — it never saw either one.
  #
  # Why it must NOT block: a dev-tool advisory whose only fix is a toolchain
  # major (dependabot #108, TypeScript 5.9.3 -> 7.0.2) would otherwise hold every
  # unrelated merge hostage to a triage. The owner chose visibility over a veto
  # on 2026-08-10. Non-blocking is a property of BRANCH PROTECTION, not of this
  # file: the required contexts on `main` are exactly Build, Linting, Type Check,
  # Unit Tests, GitGuardian Security Checks (read from
  # `repos/rodmen07/infraportal/branches/main/protection` on 2026-08-10, and this
  # job's name is deliberately absent from that list). `Deploy to GitHub Pages`
  # is a separate `push`-triggered workflow, not a `workflow_run` consumer of
  # this one, so a red here cannot hold the deploy either.
  #
  # Deliberately NOT `continue-on-error: true`. That would make the job report
  # green while finding advisories, which is an inert surface, not a
  # non-blocking one — the distinction this whole item is about.
  #
  # OPERATIONAL NOTE: because this job also runs on `push` to main, a dev-tree
  # advisory will show the `Tests` workflow RUN as failed on main while all five
  # required contexts stay green. That is a TRIAGE signal, not a broken-main
  # incident: read which job failed before treating it as one.
  #
  # Guarded by src/features/site/dependencyAuditGate.test.ts, which discovers
  # every `npm audit` invocation in every workflow, holds each to the same
  # severity floor, and asserts this one lives outside the required-context jobs
  # while the `--omit=dev` gate stays inside one.
  audit-full-tree:
    runs-on: ubuntu-latest
    name: Full-tree audit (advisory)
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit the full dependency tree
        # No `--omit=dev`: that omission IS the point of this job.
        # Same `--audit-level=moderate` floor as the required gate, so the two
        # never disagree about what counts as a finding — only about scope.
        run: npm audit --audit-level=moderate

      - name: Explain a failure
        # The message deliberately avoids the literal token this job's own
        # guard scans for -- dependencyAuditGate.test.ts discovers audit steps
        # by matching `npm audit` in `run:`, so prose naming the command would
        # be parsed as a THIRD audit invocation with no `--audit-level`. It was:
        # the first version of this step reddened three assertions in that file
        # before this branch was pushed, which is the guard working.
        if: failure()
        run: |
          echo "::warning::The full-tree dependency audit found a moderate+ advisory outside the shipped tree."
          echo "::warning::This job is NOT a required status check and does NOT block this merge (DEP-AUDIT-SCOPE-1, owner decision 2026-08-10)."
          echo "::warning::Triage it: fix, or record an accepted risk with its advisory id in the infraportal backlog."
        shell: bash

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        # Audit shipped (production) dependencies and fail on moderate+ severity.
        # Dev/build-tool advisories (e.g. a typescript major-version bump) are
        # tracked separately so they do not block delivery of the app itself.
        #
        # The threshold was `high` until 2026-08-07, when GHSA-55q2-fjhq-7xh7
        # (dompurify <=3.4.12, MODERATE: "IN_PLACE hook removal leaves a
        # detached subtree executable, causing XSS") sat in a DIRECT production
        # dependency while this step still exited 0. Measured both directions on
        # the same pre-fix lockfile: `--audit-level=high` PRINTED the advisory
        # and exited 0; `--audit-level=moderate` exited 1. dompurify is the
        # app's only untrusted-HTML sanitiser -- `DOMPurify.sanitize(email
        # .body_html)` feeds the single dangerouslySetInnerHTML on a portal
        # surface (src/features/portal/projectDetail.tsx:193) -- so the one
        # advisory class this gate exists to stop was exactly the class it could
        # not see. `high` is a reasonable floor for a large dependency tree;
        # this repo's production tree is four direct packages (dompurify,
        # highlight.js, react, react-dom), so `moderate` costs ~nothing.
        #
        # Locked against silent loosening (threshold drift, `continue-on-error`,
        # `|| true`) and against scope drift (a devDependency that shipped code
        # imports would be bundled yet invisible to `--omit=dev`) by
        # src/features/site/dependencyAuditGate.test.ts.
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Assert every test file actually ran
        # COVERAGE-UNDERRUN-1 (observed 2026-08-08): the step above printed
        # `Test Files  85 passed (85)` and exited 0 while `src/**/*.test.ts`
        # held 95 files. Ten files never ran, nothing was reported failed or
        # skipped, and the only symptom was a number in a summary line that
        # nothing compared against anything.
        #
        # A vitest run cannot police its own file discovery -- a test that did
        # not load cannot assert that it did not load -- so this is the only
        # place the check can live: after the runner, against the runner's own
        # JSON enumeration of the files it loaded, compared to the disk.
        #
        # It is a separate step rather than a flag on the one above because the
        # under-run signature is exit 0 with a short count: the suite must be
        # allowed to finish and report success before this contradicts it.
        #
        # Locked against silent loosening (a dropped --reporter=json, a moved
        # report path, a `continue-on-error`, this step being reordered before
        # the suite) by src/features/site/testDiscoveryGuard.test.ts.
        run: npm run check-test-discovery

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage-final.json
          flags: infraportal
          name: infraportal-coverage
        continue-on-error: true

      - name: Check test results
        if: failure()
        run: echo "::error::Tests failed. See output above for details."
        shell: bash

  lint:
    runs-on: ubuntu-latest
    name: Linting
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check lint results
        if: failure()
        run: echo "::error::Linting failed. See output above for details."
        shell: bash

  typecheck:
    runs-on: ubuntu-latest
    name: Type Check
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        # tsc is the only gate that catches undefined imports / type errors.
        # vite build uses esbuild, which strips types without checking, so
        # runtime-fatal bugs (e.g. a missing import) can otherwise ship to prod.
        run: npm run typecheck

      - name: Check typecheck results
        if: failure()
        run: echo "::error::Type check failed. Undefined imports or type errors would crash at runtime."
        shell: bash

  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        # The ONLY required check that runs the real Vite/PostCSS production
        # build. tsc/eslint/vitest never invoke PostCSS, so a build-breaking
        # regression - e.g. a literal `*/` inside a CSS comment, which shipped
        # TWICE in v1.18.4 (PR #40/#41) and only failed the post-merge Pages
        # deploy - could merge with every required check green. This closes that
        # gap: a broken production build now blocks the merge, not the deploy.
        run: npm run build

      - name: Check build results
        if: failure()
        run: echo "::error::Production build failed (Vite/PostCSS). A broken build would fail the Pages deploy after merge - fix before merging."
        shell: bash
