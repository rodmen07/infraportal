<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/rmcc.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RM Cloud Consulting</title>

    <!-- v1.18.3 (F9, D8): meta description + OpenGraph/Twitter cards so
         sharing the portfolio unfurls a real preview instead of a bare
         link. og-image.png is a real committed 1200x630 PNG asset (see
         public/og-image.png, generated by a one-off Pillow script, not an
         npm dependency); a raster PNG is used deliberately over the
         existing public/rmcc.svg favicon mark because Twitter Cards does
         not support SVG for twitter:image and LinkedIn's previewer is
         unreliable with SVG too. The URL is site-wide, not per-route,
         because this is a hash router on GitHub Pages (see the doc's
         "hash-router metadata limits" risk note): every shared link is the
         same site, so one card is the correct scope, not a gap. -->
    <meta name="description" content="I design, build, and operate production cloud infrastructure and DevSecOps pipelines, from architecture through a hands-on launch. Free 30-minute discovery call." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RM Cloud Consulting" />
    <meta property="og:title" content="RM Cloud Consulting - Cloud Infrastructure & DevSecOps" />
    <meta property="og:description" content="I design, build, and operate production cloud infrastructure and DevSecOps pipelines, from architecture through a hands-on launch. Free 30-minute discovery call." />
    <meta property="og:url" content="https://rodmen07.github.io/infraportal/" />
    <meta property="og:image" content="https://rodmen07.github.io/infraportal/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RM Cloud Consulting - Cloud Infrastructure & DevSecOps" />
    <meta name="twitter:description" content="I design, build, and operate production cloud infrastructure and DevSecOps pipelines, from architecture through a hands-on launch. Free 30-minute discovery call." />
    <meta name="twitter:image" content="https://rodmen07.github.io/infraportal/og-image.png" />
  </head>
  <body>
    <div id="boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#09090b;color:#e4e4e7;padding:24px;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;">
      <div style="max-width:560px;border:1px solid rgba(239,68,68,.35);background:rgba(24,24,27,.92);border-radius:16px;padding:20px 18px;box-shadow:0 10px 30px rgba(0,0,0,.45);">
        <h1 style="margin:0 0 10px 0;font-size:20px;line-height:1.3;color:#fca5a5;">Main page did not load yet</h1>
        <p style="margin:0 0 6px 0;font-size:14px;line-height:1.6;color:#d4d4d8;">If this message stays on screen, the app bundle likely failed to start.</p>
        <p style="margin:0 0 14px 0;font-size:12px;line-height:1.5;color:#a1a1aa;">Try refreshing, then open devtools console if the issue persists.</p>
        <button type="button" onclick="window.location.reload()" style="border:1px solid rgba(113,113,122,.7);background:#27272a;color:#fafafa;border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;">Reload page</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Apply saved theme before React mounts to prevent flash of wrong theme
      ;(function(){var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
